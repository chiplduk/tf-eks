apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-api
  namespace: open-api
  labels:
    app.kubernetes.io/name: open-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: open-api
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-api
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: open-api
          image: hashicorp/http-echo
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8080
            - -text=open-api
          ports:
            - name: app-port
              containerPort: 8080
          resources:
            requests:
              cpu: 0.125
              memory: 50Mi