apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-api
  namespace: secure-api
  labels:
    app.kubernetes.io/name: secure-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-api
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-api
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: secure-api
          image: hashicorp/http-echo
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8080
            - -text=secure-api
          ports:
            - name: app-port
              containerPort: 8080
          resources:
            requests:
              cpu: 0.125
              memory: 50Mi
          livenessProbe:
            httpGet:
              path: /
              port: app-port
            failureThreshold: 1
            periodSeconds: 10
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: app-port
            periodSeconds: 5              
          env:
          - name: PSP_ENCRYPTION_SALT
            valueFrom:
              secretKeyRef:
                name: secure-api-params
                key: psp-encryption-salt
          - name: PSP_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secure-api-params
                key: psp-encryption-key
          - name: HCHA_URL
            valueFrom:
              secretKeyRef:
                name: secure-api-params
                key: hcha-url
          - name: HCHA_PORT
            valueFrom:
              secretKeyRef:
                name: secure-api-params
                key: hcha-port
          - name: HC_VAULT_TOKEN
            valueFrom:
              secretKeyRef:
                name: secure-api-params
                key: hc-vault-token
          - name: HC_VAULT_ACCESSOR
            valueFrom:
              secretKeyRef:
                name: secure-api-params
                key: hc-vault-accessor